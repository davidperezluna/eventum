<div class="ev-panel">
  <div class="ev-panel__scroll">
    <p class="ev-panel__lead">
      Define dónde ocurre el evento y cuándo estará activo, tanto para la experiencia como para la venta de entradas.
    </p>

    <ev-notice
      *ngIf="panelInsight as insight"
      variant="warning"
      [message]="insight.message"
      [actionLabel]="insight.ctaLabel"
    />

    <ev-panel-form>
      <div class="ev-form">
        <ev-form-section icon="place" title="Lugar" description="Opcional. Ayuda a ubicar el evento.">
          <div class="ev-form-grid ev-form-grid--2">
            <div class="ev-field">
              <label class="ev-field__label" for="fechas-lugar">Lugar</label>
              <ev-select
                id="fechas-lugar"
                [(ngModel)]="lugarId"
                (ngModelChange)="onFormChange()"
                [options]="lugarOptions"
                placeholder="Sin lugar"
                [clearable]="true"
                [disabled]="saving"
              />
            </div>
            <div class="ev-field">
              <label class="ev-field__label" for="fechas-edad">Edad mínima</label>
              <ev-number-input
                id="fechas-edad"
                mode="integer"
                [min]="0"
                [(ngModel)]="edadMinima"
                (ngModelChange)="onFormChange()"
                placeholder="Sin restricción"
                [disabled]="saving"
              />
            </div>
          </div>
        </ev-form-section>

        <ev-form-section icon="event" title="Fechas del evento" description="Cuándo ocurre la experiencia en vivo.">
          <ev-datetime-period
            startLabel="El evento inicia"
            endLabel="El evento termina"
            startId="fechas-inicio"
            endId="fechas-fin"
            [required]="true"
            [disabled]="saving"
            [start]="fechaInicio"
            (startChange)="fechaInicio = $event; onFormChange()"
            [end]="fechaFin"
            (endChange)="fechaFin = $event; onFormChange()"
          />
        </ev-form-section>

        <ev-form-section icon="sell" title="Venta de entradas" description="Periodo en el que se pueden comprar boletas.">
          <ev-datetime-period
            startLabel="Venta inicia"
            endLabel="Venta termina"
            startId="fechas-venta-inicio"
            endId="fechas-venta-fin"
            [required]="true"
            [disabled]="saving"
            [start]="fechaVentaInicio"
            (startChange)="fechaVentaInicio = $event; onFormChange()"
            [end]="fechaVentaFin"
            (endChange)="fechaVentaFin = $event; onFormChange()"
          />
        </ev-form-section>
      </div>
    </ev-panel-form>
  </div>

  <ev-drawer-footer>
    <ev-button variant="ghost" [disabled]="saving" (click)="closePanel()">Cerrar</ev-button>
    <ev-button variant="primary" [disabled]="!canSave" [loading]="saving" (click)="save()">Guardar</ev-button>
  </ev-drawer-footer>
</div>
