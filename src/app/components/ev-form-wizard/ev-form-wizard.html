<div class="ev-form-wizard" role="navigation" aria-label="Progreso del asistente">
  <div class="ev-form-wizard__progress">
    <span class="ev-form-wizard__counter">Paso {{ currentStep + 1 }} de {{ steps.length }}</span>
    <div
      class="ev-form-wizard__track"
      role="progressbar"
      [attr.aria-valuenow]="progressPercent"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-valuetext]="'Paso ' + (currentStep + 1) + ' de ' + steps.length + ', ' + progressPercent + '%'"
    >
      <div class="ev-form-wizard__fill" [style.width.%]="progressPercent"></div>
    </div>
    <span class="ev-form-wizard__current-name">{{ steps[currentStep]?.label }}</span>
  </div>

  <ol class="ev-form-wizard__trail" aria-hidden="true">
    <li
      *ngFor="let step of steps; let i = index"
      class="ev-form-wizard__trail-item"
      [class.ev-form-wizard__trail-item--done]="isCompleted(i)"
      [class.ev-form-wizard__trail-item--current]="isCurrent(i)"
    >
      <span class="ev-form-wizard__trail-label">{{ step.label }}</span>
    </li>
  </ol>
</div>
