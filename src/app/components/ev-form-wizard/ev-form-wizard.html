<div class="ev-form-wizard" role="navigation" aria-label="Progreso del asistente">
  <div class="ev-form-wizard__progress-head">
    <span class="ev-form-wizard__step-label">
      Paso {{ currentStep + 1 }} de {{ steps.length }}
      <span class="ev-form-wizard__step-name">— {{ steps[currentStep]?.label }}</span>
    </span>
    <span class="ev-form-wizard__percent">{{ progressPercent }}%</span>
  </div>
  <div
    class="ev-form-wizard__track"
    role="progressbar"
    [attr.aria-valuenow]="progressPercent"
    aria-valuemin="0"
    aria-valuemax="100"
  >
    <div class="ev-form-wizard__fill" [style.width.%]="progressPercent"></div>
  </div>
  <ol class="ev-form-wizard__steps">
    <li
      *ngFor="let step of steps; let i = index"
      class="ev-form-wizard__step"
      [class.ev-form-wizard__step--done]="isCompleted(i)"
      [class.ev-form-wizard__step--current]="isCurrent(i)"
    >
      <span class="ev-form-wizard__dot" aria-hidden="true">
        <span class="material-icons" *ngIf="isCompleted(i)">check</span>
        <ng-container *ngIf="!isCompleted(i)">{{ i + 1 }}</ng-container>
      </span>
      <span class="ev-form-wizard__label">{{ step.label }}</span>
    </li>
  </ol>
</div>
