<aside class="ev-evento-preview" aria-label="Vista previa del evento">
  <ev-evento-card
    [titulo]="titulo"
    [metaLine]="metaLine"
    [coverUrl]="coverUrl"
    [iniciales]="iniciales"
    [estadoLabel]="cardEstadoLabel"
    [statusDotClass]="statusClass"
    [destacado]="!!formData.destacado"
    [showStatus]="showStatusBadge"
    [interactive]="false"
    [titlePlaceholder]="isDefaultTitle"
    [metaPlaceholder]="!metaLine"
  />
</aside>
