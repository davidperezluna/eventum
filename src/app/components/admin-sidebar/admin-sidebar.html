<!-- Barra superior móvil -->
<header class="ev-admin-topbar" aria-label="Barra superior móvil">
  <div class="ev-admin-topbar__inner">
    <button
      type="button"
      class="ev-admin-topbar__menu"
      (click)="toggleSidebar.emit()"
      aria-label="Abrir menú"
    >
      <span class="material-icons" aria-hidden="true">menu</span>
    </button>
    <a [routerLink]="homeRoute" class="ev-admin-topbar__brand" aria-label="Eventum, ir al panel">
      <img src="logo-eventum.svg" alt="Eventum" class="ev-admin-topbar__logo" />
    </a>
    <div class="ev-admin-topbar__spacer" aria-hidden="true"></div>
  </div>
</header>

<!-- Overlay móvil -->
<div
  class="ev-admin-sidebar__overlay"
  *ngIf="open"
  (click)="closeSidebar.emit()"
  aria-hidden="true"
></div>

<!-- Sidebar -->
<aside
  class="ev-admin-sidebar"
  [class.ev-admin-sidebar--open]="open"
  [class.ev-admin-sidebar--compact]="compact"
  aria-label="Navegación del panel"
>
  <!-- Header -->
  <header class="ev-admin-sidebar__header">
    <div class="ev-admin-sidebar__header-row">
      <a [routerLink]="homeRoute" class="ev-admin-sidebar__brand" aria-label="Eventum, inicio">
        <img src="logo-eventum.svg" alt="Eventum" class="ev-admin-sidebar__logo" />
      </a>
      <button
        type="button"
        class="ev-admin-sidebar__close"
        (click)="closeSidebar.emit()"
        aria-label="Cerrar menú"
      >
        <span class="material-icons" aria-hidden="true">close</span>
      </button>
    </div>
    <p class="ev-admin-sidebar__subtitle">{{ panelTitle }}</p>
  </header>

  <!-- Navegación -->
  <nav class="ev-admin-sidebar__nav" aria-label="Secciones del panel">
    <ng-container *ngFor="let section of sections; trackBy: trackSection">
      <div class="ev-admin-sidebar__section">
        <p *ngIf="section.label" class="ev-admin-sidebar__section-label">
          {{ section.label }}
        </p>

        <ng-container *ngFor="let entry of section.entries; trackBy: trackEntry">
          <!-- Enlace directo -->
          <a
            *ngIf="entry.kind === 'link'"
            [routerLink]="entry.path"
            class="ev-admin-sidebar__link"
            [class.ev-admin-sidebar__link--active]="isLinkActive(entry.path)"
            [attr.data-tooltip]="compact ? entry.label : null"
            (click)="onNavClick()"
          >
            <span class="material-icons ev-admin-sidebar__icon" aria-hidden="true">{{ entry.icon }}</span>
            <span class="ev-admin-sidebar__label">{{ entry.label }}</span>
          </a>

          <!-- Grupo colapsable -->
          <div *ngIf="entry.kind === 'group'" class="ev-admin-sidebar__group">
            <button
              type="button"
              class="ev-admin-sidebar__link ev-admin-sidebar__link--group"
              [class.ev-admin-sidebar__link--active]="isGroupActive(entry)"
              [attr.aria-expanded]="isGroupExpanded(entry)"
              [attr.data-tooltip]="compact ? entry.label : null"
              (click)="toggleGroup(entry)"
            >
              <span class="material-icons ev-admin-sidebar__icon" aria-hidden="true">{{ entry.icon }}</span>
              <span class="ev-admin-sidebar__label">{{ entry.label }}</span>
              <span class="material-icons ev-admin-sidebar__chevron" aria-hidden="true">
                {{ isGroupExpanded(entry) ? 'expand_less' : 'expand_more' }}
              </span>
            </button>

            <div
              class="ev-admin-sidebar__submenu"
              [class.ev-admin-sidebar__submenu--open]="isGroupExpanded(entry)"
            >
              <div class="ev-admin-sidebar__submenu-inner">
                <a
                  *ngFor="let child of entry.children"
                  [routerLink]="child.path"
                  class="ev-admin-sidebar__link ev-admin-sidebar__link--sub"
                  [class.ev-admin-sidebar__link--active]="isLinkActive(child.path)"
                  [attr.data-tooltip]="compact ? child.label : null"
                  (click)="onNavClick()"
                >
                  <span class="material-icons ev-admin-sidebar__icon ev-admin-sidebar__icon--sub" aria-hidden="true">
                    {{ child.icon }}
                  </span>
                  <span class="ev-admin-sidebar__label">{{ child.label }}</span>
                </a>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </ng-container>
  </nav>

  <!-- Footer -->
  <footer class="ev-admin-sidebar__footer">
    <div class="ev-admin-sidebar__account" *ngIf="userEmail">
      <div class="ev-admin-sidebar__account-identity">
        <span class="material-icons ev-admin-sidebar__account-icon" aria-hidden="true">account_circle</span>
        <div class="ev-admin-sidebar__account-text">
          <span class="ev-admin-sidebar__account-role" *ngIf="userRole">{{ userRole }}</span>
          <span class="ev-admin-sidebar__account-email">{{ userEmail }}</span>
        </div>
      </div>
      <button type="button" class="ev-admin-sidebar__logout" (click)="logout.emit()">
        <span class="material-icons" aria-hidden="true">logout</span>
        <span class="ev-admin-sidebar__logout-label">Cerrar sesión</span>
      </button>
    </div>

    <div class="ev-admin-sidebar__footer-actions">
      <button
        type="button"
        class="ev-admin-sidebar__compact-toggle"
        (click)="toggleCompact()"
        [attr.aria-label]="compact ? 'Expandir menú' : 'Contraer menú'"
        [attr.data-tooltip]="compact ? 'Expandir' : 'Contraer'"
      >
        <span class="material-icons" aria-hidden="true">
          {{ compact ? 'chevron_right' : 'chevron_left' }}
        </span>
      </button>
      <p class="ev-admin-sidebar__copyright">&copy; {{ currentYear }} Eventum</p>
    </div>
  </footer>
</aside>
