<div
  class="ev-panel-sidebar-overlay"
  *ngIf="open"
  (click)="closePanel.emit()"
  aria-hidden="true"
></div>

<aside
  class="ev-panel-sidebar"
  [class.ev-panel-sidebar--open]="open"
  [class.ev-panel-sidebar--compact]="compact"
  [class.ev-panel-sidebar--organizer]="variant === 'organizer'"
  aria-label="Navegación del panel"
>
  <header class="ev-panel-sidebar__header">
    <div class="ev-panel-sidebar__brand-row">
      <a
        [routerLink]="homeRoute"
        class="ev-panel-sidebar__brand"
        aria-label="Eventum, ir al inicio"
        (click)="onNavigate()"
      >
        <img src="logo-eventum.svg" alt="" class="ev-panel-sidebar__logo" />
      </a>

      <div class="ev-panel-sidebar__header-tools">
        <button
          type="button"
          class="ev-panel-sidebar__tool"
          [attr.aria-label]="compact ? 'Expandir menú' : 'Menú compacto'"
          (click)="toggleCompact()"
        >
          <span class="material-icons" aria-hidden="true">{{ compact ? 'chevron_right' : 'chevron_left' }}</span>
        </button>
        <button
          type="button"
          class="ev-panel-sidebar__tool ev-panel-sidebar__tool--close"
          (click)="closePanel.emit()"
          aria-label="Cerrar menú"
        >
          <span class="material-icons" aria-hidden="true">close</span>
        </button>
      </div>
    </div>

    <p class="ev-panel-sidebar__tagline" *ngIf="!compact && headerTagline">{{ headerTagline }}</p>
  </header>

  <nav class="ev-panel-sidebar__nav" aria-label="Secciones">
    <ng-container *ngFor="let section of sections; trackBy: trackSection">
      <div
        *ngIf="section.separator && !compact"
        class="ev-panel-sidebar__rule"
        role="separator"
        aria-hidden="true"
      ></div>

      <div
        class="ev-panel-sidebar__section"
        [class.ev-panel-sidebar__section--hub]="section.tone === 'hub'"
        [class.ev-panel-sidebar__section--quiet]="section.tone === 'quiet'"
      >
        <p
          *ngIf="section.label && section.tone !== 'hub' && !compact"
          class="ev-panel-sidebar__section-label"
        >
          {{ section.label }}
        </p>

        <ng-container *ngFor="let entry of section.entries; trackBy: trackEntry">
          <a
            *ngIf="isAdminNavLink(entry)"
            [routerLink]="entry.path"
            routerLinkActive="ev-panel-sidebar__item--active"
            [routerLinkActiveOptions]="{ exact: isExactLink(entry) }"
            class="ev-panel-sidebar__item"
            [class.ev-panel-sidebar__item--hub]="entry.variant === 'hub'"
            [attr.title]="compact ? entry.label : null"
            (click)="onNavigate()"
          >
            <span
              *ngIf="entry.icon"
              class="material-icons ev-panel-sidebar__icon"
              aria-hidden="true"
            >{{ entry.icon }}</span>
            <span class="ev-panel-sidebar__label">{{ entry.label }}</span>
          </a>

          <div *ngIf="isAdminNavGroup(entry)" class="ev-panel-sidebar__group">
            <button
              type="button"
              class="ev-panel-sidebar__item ev-panel-sidebar__item--group"
              [class.ev-panel-sidebar__item--active]="isGroupActive(entry)"
              [attr.aria-expanded]="isGroupExpanded(entry)"
              [attr.title]="compact ? entry.label : null"
              (click)="toggleGroup(entry, $event)"
            >
              <span class="material-icons ev-panel-sidebar__icon" aria-hidden="true">{{ entry.icon }}</span>
              <span class="ev-panel-sidebar__label">{{ entry.label }}</span>
              <span class="material-icons ev-panel-sidebar__chevron" aria-hidden="true">
                {{ isGroupExpanded(entry) ? 'expand_less' : 'expand_more' }}
              </span>
            </button>

            <div
              class="ev-panel-sidebar__subnav"
              *ngIf="isGroupExpanded(entry) && !compact"
              [attr.aria-label]="'Detalle de ' + entry.label"
            >
              <a
                *ngFor="let child of entry.children"
                [routerLink]="child.path"
                routerLinkActive="ev-panel-sidebar__item--active"
                class="ev-panel-sidebar__item ev-panel-sidebar__item--child"
                (click)="onNavigate()"
              >
                <span class="ev-panel-sidebar__label">{{ child.label }}</span>
              </a>
            </div>
          </div>
        </ng-container>
      </div>
    </ng-container>
  </nav>

  <footer class="ev-panel-sidebar__footer">
    <div class="ev-panel-sidebar__rule" role="separator" aria-hidden="true"></div>

    <div class="ev-panel-sidebar__account" *ngIf="userEmail && !compact">
      <p class="ev-panel-sidebar__account-name">{{ accountLabel }}</p>
      <button type="button" class="ev-panel-sidebar__signout" (click)="logoutClick.emit()">
        Salir
      </button>
    </div>

    <button
      *ngIf="compact || !userEmail"
      type="button"
      class="ev-panel-sidebar__tool ev-panel-sidebar__tool--logout"
      aria-label="Cerrar sesión"
      (click)="logoutClick.emit()"
    >
      <span class="material-icons" aria-hidden="true">logout</span>
    </button>
  </footer>
</aside>
