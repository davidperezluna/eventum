<form (ngSubmit)="guardar()" class="completar-perfil-form" novalidate>
  <section class="completar-perfil-form__section" aria-label="Nombre">
    <div class="completar-perfil-form__row">
      <div
        class="legal-modal__field"
        [class.completar-perfil-form__field--incomplete]="!!errorNombre()"
      >
        <label for="completar-perfil-nombre">Nombre *</label>
        <input
          id="completar-perfil-nombre"
          type="text"
          [(ngModel)]="nombre"
          name="nombre"
          placeholder="Tu nombre"
          autocomplete="given-name"
          [disabled]="guardando"
          (blur)="marcarTocado('nombre')"
        />
        <p
          class="completar-perfil-form__field-error"
          *ngIf="mostrarMensajeError('nombre') && errorNombre()"
          role="alert"
        >
          {{ errorNombre() }}
        </p>
      </div>
      <div
        class="legal-modal__field"
        [class.completar-perfil-form__field--incomplete]="!!errorApellido()"
      >
        <label for="completar-perfil-apellido">Apellido *</label>
        <input
          id="completar-perfil-apellido"
          type="text"
          [(ngModel)]="apellido"
          name="apellido"
          placeholder="Tu apellido"
          autocomplete="family-name"
          [disabled]="guardando"
          (blur)="marcarTocado('apellido')"
        />
        <p
          class="completar-perfil-form__field-error"
          *ngIf="mostrarMensajeError('apellido') && errorApellido()"
          role="alert"
        >
          {{ errorApellido() }}
        </p>
      </div>
    </div>
  </section>

  <section class="completar-perfil-form__section" aria-label="Identificación y contacto">
    <div
      class="legal-modal__field"
      [class.completar-perfil-form__field--incomplete]="!!errorDocumento()"
    >
      <label for="completar-perfil-documento">Documento de identidad *</label>
      <input
        id="completar-perfil-documento"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        maxlength="12"
        [(ngModel)]="documento"
        name="documento"
        placeholder="Cédula (6 a 10 dígitos)"
        [disabled]="guardando"
        (blur)="marcarTocado('documento')"
      />
      <p
        class="completar-perfil-form__field-error"
        *ngIf="mostrarMensajeError('documento') && errorDocumento()"
        role="alert"
      >
        {{ errorDocumento() }}
      </p>
    </div>

    <div
      class="legal-modal__field"
      [class.completar-perfil-form__field--incomplete]="!!errorTelefono()"
    >
      <label for="completar-perfil-telefono">Teléfono *</label>
      <app-telefono-colombia-input
        inputId="completar-perfil-telefono"
        [(ngModel)]="telefono"
        name="telefono"
        [hasError]="!!errorTelefono()"
        [disabled]="guardando"
        (blurred)="marcarTocado('telefono')"
      />
      <p
        class="completar-perfil-form__field-error"
        *ngIf="mostrarMensajeError('telefono') && errorTelefono()"
        role="alert"
      >
        {{ errorTelefono() }}
      </p>
    </div>

    <div
      class="legal-modal__field"
      [class.completar-perfil-form__field--incomplete]="!!errorFechaNacimiento()"
    >
      <label for="completar-perfil-fecha">Fecha de nacimiento *</label>
      <p class="completar-perfil-form__field-hint">Solo mayores de 18 años.</p>
      <ev-date-picker
        id="completar-perfil-fecha"
        [(ngModel)]="fechaNacimiento"
        name="fechaNacimiento"
        [disabled]="guardando"
        [hasError]="!!errorFechaNacimiento()"
        (ngModelChange)="marcarTocado('fechaNacimiento')"
      />
      <p
        class="completar-perfil-form__field-error"
        [class.completar-perfil-form__field-error--edad]="esErrorMenorDeEdad()"
        *ngIf="mostrarMensajeError('fechaNacimiento') && errorFechaNacimiento()"
        role="alert"
      >
        {{ errorFechaNacimiento() }}
      </p>
    </div>

    <div
      class="legal-modal__field"
      [class.completar-perfil-form__field--incomplete]="!!errorGenero()"
    >
      <label for="completar-perfil-genero">Género *</label>
      <ev-select
        id="completar-perfil-genero"
        [(ngModel)]="genero"
        name="genero"
        [options]="generoOptions"
        placeholder="Selecciona género"
        [disabled]="guardando"
        [hasError]="!!errorGenero()"
        [fullWidth]="true"
        [searchable]="false"
        ariaLabel="Género"
        (selectionChange)="marcarTocado('genero')"
      />
      <p
        class="completar-perfil-form__field-error"
        *ngIf="mostrarMensajeError('genero') && errorGenero()"
        role="alert"
      >
        {{ errorGenero() }}
      </p>
    </div>
  </section>

  <section
    *ngIf="!consentimientoDatosPrevio"
    class="completar-perfil-form__section completar-perfil-form__section--legal"
    aria-label="Autorización de datos personales"
  >
    <p class="completar-perfil-form__legal-resumen">{{ tratamientoDatosResumen }}</p>

    <label
      class="completar-perfil-form__legal-check"
      [class.completar-perfil-form__legal-check--checked]="aceptaTratamientoDatos"
      [class.completar-perfil-form__legal-check--incomplete]="!!errorTratamientoDatos()"
    >
      <input
        type="checkbox"
        [checked]="aceptaTratamientoDatos"
        [disabled]="guardando"
        (change)="onTratamientoDatosChange($event)"
      />
      <span class="completar-perfil-form__legal-check-box" aria-hidden="true"></span>
      <span class="completar-perfil-form__legal-check-text">{{ tratamientoDatosCheckbox }}</span>
    </label>

    <details class="completar-perfil-form__legal-details">
      <summary>Ver detalle</summary>
      <ul class="completar-perfil-form__legal-list">
        <li *ngFor="let linea of tratamientoDatosLineas">{{ linea }}</li>
      </ul>
    </details>

    <p
      class="completar-perfil-form__field-error"
      *ngIf="mostrarMensajeError('tratamientoDatos') && errorTratamientoDatos()"
      role="alert"
    >
      {{ errorTratamientoDatos() }}
    </p>
  </section>

  <p class="legal-modal__error" *ngIf="error" role="alert">{{ error }}</p>

  <footer class="completar-perfil-form__footer">
    <button
      type="button"
      class="legal-modal__btn legal-modal__btn-secondary"
      *ngIf="mostrarCancelar"
      (click)="cancelado.emit()"
      [disabled]="guardando"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="legal-modal__btn legal-modal__btn-primary completar-perfil-form__submit"
      [disabled]="guardando || !puedeEnviar"
      [attr.aria-busy]="guardando"
    >
      <span class="completar-perfil-form__btn-spinner" *ngIf="guardando" aria-hidden="true"></span>
      {{ guardando ? 'Guardando…' : textoBotonPrimario }}
    </button>
  </footer>
</form>
