<section class="ev-form-section">
  <header class="ev-form-section__head">
    <div class="ev-form-section__identity">
      <span *ngIf="icon" class="ev-form-section__icon" aria-hidden="true">
        <span class="material-icons">{{ icon }}</span>
      </span>
      <div class="ev-form-section__copy">
        <h3 class="ev-form-section__title">{{ title }}</h3>
        <p *ngIf="description" class="ev-form-section__desc">{{ description }}</p>
      </div>
    </div>
  </header>
  <div class="ev-form-section__body">
    <ng-content />
  </div>
</section>
